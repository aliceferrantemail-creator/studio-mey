<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive — STUDIO MEY</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    .gallery--single {
      columns: 1 !important;
      max-width: 600px !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
    .book-viewer {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .book-stage {
      position: relative;
      flex: 1;
      aspect-ratio: 1466 / 986;
      background: #fafafa;
      border: 1px solid #ebebeb;
      overflow: hidden;
    }
    .overlay-images .book-stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .overlay-images .book-stage img.current {
      opacity: 1;
      transform: scale(1);
    }
    .book-stage-click {
      position: absolute;
      inset: 0;
      display: flex;
      cursor: pointer;
    }
    .book-stage-click span { flex: 1; }
    .book-stage-click span:first-child { cursor: w-resize; }
    .book-stage-click span:last-child { cursor: e-resize; }
    .book-arrow {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--ink-faint);
      font-size: 1.4rem;
      font-weight: 300;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .book-arrow:hover { color: var(--ink); }
    .book-arrow:disabled { opacity: 0.25; cursor: default; }
    .book-progress {
      text-align: center;
      font-size: 0.62rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: var(--ink-faint);
      margin-top: 14px;
    }
    @media (max-width: 600px) {
      .book-viewer { gap: 6px; }
      .book-arrow { width: 22px; font-size: 1.1rem; }
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <img class="bg-image" src="images/bg.jpg" alt="" aria-hidden="true" />
  </div>

  <header class="nav">
    <a href="index.html" class="nav-logo">STUDIO MEY<span class="nav-tagline">Art Direction & Set Design</span></a>
        <nav class="nav-links">
      <a href="index.html" class="nav-link">Images</a>
      <a href="moving-images.html" class="nav-link">Moving Images</a>
      <a href="graphics.html" class="nav-link">Graphics</a>
      <a href="events.html" class="nav-link">Events</a>
      <a href="archive.html" class="nav-link active">Archive</a>
      <a href="info.html" class="nav-link">Info</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
  <button class="nav-hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  </header>

  <nav class="nav-mobile" id="mobileMenu">
    <a href="index.html" class="nav-mobile-link ">Images</a>
    <a href="moving-images.html" class="nav-mobile-link ">Moving Images</a>
    <a href="graphics.html" class="nav-mobile-link ">Graphics</a>
    <a href="events.html" class="nav-mobile-link ">Events</a>
    <a href="archive.html" class="nav-mobile-link active">Archive</a>
    <a href="info.html" class="nav-mobile-link ">Info</a>
    <a href="contact.html" class="nav-mobile-link ">Contact</a>

  <main class="gallery gallery--single" id="gallery">

    <article class="project-card" id="bookThumbCard">
      <div class="card-img-wrap">
        <img src="images/book1-pages/page-01.jpg" alt="India - Nepal, July - August 2022" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

    <article class="project-card" data-project="0">
      <div class="card-img-wrap">
        <img src="images/laser1.jpg" alt="Laser cut wooden pieces - personal experiment" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

    <article class="project-card" data-project="1">
      <div class="card-img-wrap">
       <img src="images/orienteerarticle1.jpg" alt="Mongolia Article for Orienteer Magazine Issue 9th" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

    <article class="project-card" data-project="2">
      <div class="card-img-wrap">
        <img src="images/peak1.jpg" alt="Mongolia article for Peak Magazine - Volume 5" loading="lazy" />

  <div class="overlay" id="overlay" aria-hidden="true">
    <button class="overlay-close" id="overlayClose" aria-label="Close project">
      <span></span><span></span>
    </button>
    <div class="overlay-inner">
      <div class="overlay-images" id="overlayImages"></div>
      <div class="overlay-info">
        <p class="overlay-number" id="overlayNumber">01</p>
        <h2 class="overlay-title" id="overlayTitle">Project Title</h2>
        <p class="overlay-description" id="overlayDescription"></p>
        <p class="overlay-credits" id="overlayCredits"></p>
      </div>
    </div>
  </div>

  <script src="archive-script.js"></script>
  <script>
    (function () {
      const total = 39;
      const pad = n => String(n).padStart(2, '0');
      const pathFor = n => `images/book1-pages/page-${pad(n)}.jpg`;
      let bookState = null;

      function bookViewerHTML() {
        return `
          <div class="book-viewer">
            <button class="book-arrow" id="bookPrev" aria-label="Previous page">‹</button>
            <div class="book-stage" id="bookStage">
              <img class="current" id="bookImgA" src="${pathFor(1)}" alt="Page 1" />
              <img id="bookImgB" src="${pathFor(1)}" alt="" />
              <div class="book-stage-click">
                <span id="bookClickPrev"></span>
                <span id="bookClickNext"></span>
              </div>
            </div>
            <button class="book-arrow" id="bookNext" aria-label="Next page">›</button>
          </div>
          <p class="book-progress"><span id="bookPageNum">1</span> / <span id="bookPageTotal">${total}</span></p>
        `;
      }

      function initBookViewer() {
        const imgA = document.getElementById('bookImgA');
        const imgB = document.getElementById('bookImgB');
        const pageNumEl = document.getElementById('bookPageNum');
        const prevBtn = document.getElementById('bookPrev');
        const nextBtn = document.getElementById('bookNext');

        const state = { page: 1 };
        let currentEl = imgA;
        let hiddenEl = imgB;

        function updateButtons() {
          prevBtn.disabled = state.page <= 1;
          nextBtn.disabled = state.page >= total;
        }

        function goTo(n) {
          n = Math.max(1, Math.min(total, n));
          if (n === state.page) return;
          hiddenEl.src = pathFor(n);
          hiddenEl.alt = `Page ${n}`;
          currentEl.classList.remove('current');
          hiddenEl.classList.add('current');
          [currentEl, hiddenEl] = [hiddenEl, currentEl];
          state.page = n;
          pageNumEl.textContent = state.page;
          updateButtons();
        }

        document.getElementById('bookClickPrev').addEventListener('click', () => goTo(state.page - 1));
        document.getElementById('bookClickNext').addEventListener('click', () => goTo(state.page + 1));
        prevBtn.addEventListener('click', () => goTo(state.page - 1));
        nextBtn.addEventListener('click', () => goTo(state.page + 1));
        updateButtons();

        bookState = { get page() { return state.page; }, goTo };
      }

      function openBook() {
        overlayImages.innerHTML = bookViewerHTML();
        overlayNumber.textContent = '';
        overlayTitle.textContent = 'India - Nepal, July - August 2022 — Alice Ferrante';
        overlayDescription.textContent = 'A little photobook with pictures taken with my Leica M6, from Ladakh all the way to Nepal, 2022.';
        overlayCredits.textContent = '';
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        overlayImages.scrollTop = 0;
        overlay.scrollTop = 0;
        initBookViewer();
      }

      const bookThumb = document.getElementById('bookThumbCard');
      bookThumb.addEventListener('click', openBook);
      bookThumb.setAttribute('tabindex', '0');
      bookThumb.setAttribute('role', 'button');
      bookThumb.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openBook();
        }
      });

      document.addEventListener('keydown', e => {
        if (!bookState || !overlay.classList.contains('open') || !document.getElementById('bookStage')) return;
        if (e.key === 'ArrowLeft') bookState.goTo(bookState.page - 1);
        if (e.key === 'ArrowRight') bookState.goTo(bookState.page + 1);
      });
    })();
  </script>
  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    mobileMenu.querySelectorAll('.nav-mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
      });
    });
  </script>
</body>
</html>
