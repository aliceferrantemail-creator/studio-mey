<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events — STUDIO MEY</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    .gallery--single {
      columns: 1 !important;
      max-width: 600px !important;
      margin-left: auto !important;
      margin-right: auto !important;
    }
  </style>
</head>
<body>

  <div class="bg-layer">
    <img class="bg-image" src="images/bg.jpg" alt="" aria-hidden="true" />
  </div>

  <header class="nav">
    <a href="index.html" class="nav-logo">STUDIO MEY</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-link">Images</a>
      <a href="moving-images.html" class="nav-link">Moving Images</a>
      <a href="events.html" class="nav-link active">Events</a>
      <a href="archive.html" class="nav-link">Archive</a>
      <a href="info.html" class="nav-link">Info</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </nav>
  <button class="nav-hamburger" id="hamburger" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>
  </header>

  <nav class="nav-mobile" id="mobileMenu">
    <a href="index.html" class="nav-mobile-link ">Images</a>
    <a href="moving-images.html" class="nav-mobile-link ">Moving Images</a>
    <a href="events.html" class="nav-mobile-link active">Events</a>
    <a href="archive.html" class="nav-mobile-link ">Archive</a>
    <a href="info.html" class="nav-mobile-link ">Info</a>
    <a href="contact.html" class="nav-mobile-link ">Contact</a>
  </nav>

  <main class="gallery gallery--single" id="gallery">

    <article class="project-card" data-project="0">
      <div class="card-img-wrap">
        <img src="images/Coteciel1.jpg" alt="Cote & Ciel Launch Event" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

    <article class="project-card" data-project="1">
      <div class="card-img-wrap">
        <img src="images/Merrellevent1.jpg" alt="Merrell x Unsanctioned Athletics" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

    <article class="project-card" data-project="2">
      <div class="card-img-wrap">
        <img src="images/Columbia1.jpg" alt="Columbia Hike Society Event" loading="lazy" />
        <div class="card-hover-label">View Project</div>
      </div>
    </article>

  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Alice Ferrante — Set Designer</span>
    <span class="footer-instagram">
      <a href="https://www.instagram.com/_mey.line_/" target="_blank" rel="noopener">@_mey.line_</a>
    </span>
  </footer>

  <div class="overlay" id="overlay" aria-hidden="true">
    <button class="overlay-close" id="overlayClose" aria-label="Close project">
      <span></span><span></span>
    </button>
    <div class="overlay-inner">
      <div class="overlay-images" id="overlayImages"></div>
      <div class="overlay-info">
        <p class="overlay-number" id="overlayNumber">01</p>
        <h2 class="overlay-title" id="overlayTitle">Project Title</h2>
        <p class="overlay-description" id="overlayDescription"></p>
        <p class="overlay-credits" id="overlayCredits"></p>
      </div>
    </div>
  </div>

  <script src="events-script.js"></script>
  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open');
    });
    mobileMenu.querySelectorAll('.nav-mobile-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('open');
        mobileMenu.classList.remove('open');
      });
    });
  </script>
</body>
</html>
